    source_type: municipality
    scraper_type: generic_html
    source_quality: medium
    active: true

  - id: jersey_city_bid_openings
    name: Jersey City Bid Openings
    county: Hudson
    municipality: Jersey City
    url: https://www.jerseycitynj.gov/cityhall/finance/purchasing/publiccontracts/bid_openings
    source_type: municipality
    scraper_type: generic_html
    source_quality: medium
    active: true

  - id: paterson_purchasing
    name: City of Paterson Purchasing
    county: Passaic
