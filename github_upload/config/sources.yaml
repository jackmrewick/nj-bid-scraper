# Source registry for the NJ Bid Intelligence Scraper.
#
# This file is your control panel. Add county, state, and municipality bid pages here.
#
# county: County name or Statewide.
# municipality: Town/city name when this is a municipal source, otherwise blank.
# scraper_type:
#   generic_html  = normal public purchasing/bids page
#   civicengage   = many municipal Bids.aspx pages
#   pdf_direct    = direct link to a public PDF notice
#
# active: false keeps the source in the registry but skips it.

settings:
  target_counties:
    - Bergen
    - Essex
    - Hudson
    - Passaic
    - Morris
    - Union
    - Sussex
    - Warren

  target_municipalities: []

  request_delay_seconds: 0.8
  timeout_seconds: 30
  max_detail_pages_per_source: 12
  same_domain_only: true

sources:
  # Statewide / state agency sources
  - id: nj_dpmc_ads
    name: NJ DPMC Contractor Project Advertisements
    county: Statewide
    municipality:
    url: https://www.nj.gov/treasury/dpmc/project_construction_advertisements.shtml
    source_type: state
    scraper_type: generic_html
    source_quality: high
    active: true

  - id: njdot_current_projects
    name: NJDOT Current Advertised Projects
    county: Statewide
    municipality:
    url: https://www.nj.gov/transportation/business/procurement/ConstrServ/curradvproj.shtm
    source_type: state
    scraper_type: generic_html
    source_quality: medium
    active: true

  # County-level sources
  - id: bergen_county_bids
    name: Bergen County BergenBids
    county: Bergen
    municipality:
    url: https://bergenbids.com/
    source_type: county
    scraper_type: generic_html
    source_quality: high
    active: true

  - id: essex_county_procure
    name: Essex County Purchasing Portal
    county: Essex
    municipality:
    url: https://www.essexcountynjprocure.org/
    source_type: county
    scraper_type: generic_html
    source_quality: high
    active: true

  - id: hudson_county_purchasing
    name: Hudson County Purchasing
    county: Hudson
    municipality:
    url: https://www.hcnj.us/finance/purchasing/
